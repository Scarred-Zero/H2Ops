version: "3.9"

services:
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: h2ops_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - h2ops_net

  redis:
    image: redis:7-alpine
    container_name: h2ops_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - h2ops_net

  mqtt_broker:
    image: eclipse-mosquitto:latest
    container_name: h2ops_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - h2ops_net

  minio:
    image: minio/minio:latest
    container_name: h2ops_minio
    restart: unless-stopped
    command: server /data --console-address ":9091"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9091:9091"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - h2ops_net

  minio-init:
    image: minio/mc:latest
    container_name: h2ops_minio_init
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./infra/minio/init-bucket.sh:/init-bucket.sh:ro
    entrypoint: ["/bin/sh", "/init-bucket.sh"]
    networks:
      - h2ops_net


  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: h2ops_backend
    restart: unless-stopped
    env_file: .env.dev.local
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      MQTT_HOST: mqtt_broker
      MQTT_PORT: 1883
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mqtt_broker:
        condition: service_started
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --app-dir /server
    volumes:
      - ./server:/server
      - /server/.venv  # <--- CRITICAL: Prevents your local files from deleting the container's virtual environment
    ports:
      - "8000:8000"
    networks:
      - h2ops_net

    
  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: h2ops_worker
    restart: unless-stopped
    env_file: .env.dev.local
    environment:
      DOCKER_CONTAINER: "true"
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DB: ${REDIS_DB}
      MINIO_HOST: ${MINIO_HOST}
      MINIO_PORT: ${MINIO_PORT}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uv run celery -A src.workers.celery_app worker --loglevel=info
    volumes:
      - ./server:/server
      - /server/.venv  # <--- CRITICAL: Prevents your local files from deleting the container's virtual environment
    depends_on:
      - backend
    networks:
      - h2ops_net

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: h2ops_frontend
    restart: unless-stopped
    env_file: .env.dev.local
    environment:
      INTERNAL_API_URL: ${INTERNAL_DOCKER_API_URL}
      BACKEND_ADMIN_API_URL: ${BACKEND_ADMIN_API_URL}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
      NODE_OPTIONS: --max-old-space-size=4096
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    command: >
      sh -c "npm install && npm run dev"
    networks:
      - h2ops_net


  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090" # Opens the Prometheus dashboard UI
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro # Mounts your config file as read-only
    depends_on:
      - backend    
    networks:
      - h2ops_net

volumes:
  pgdata:
  mosquitto_data:
  mosquitto_log:
  minio_data:

networks:
  h2ops_net:
    driver: bridge
